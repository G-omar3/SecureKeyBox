<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="1060" viewBox="0 0 1440 1060" role="img" aria-labelledby="title desc">
<title id="title">SecureKeyBox operational workflow</title>
<desc id="desc">Nine stages from traffic ingress to assistant support. Approved operator decisions return to the firewall, while assistant guidance returns to the operator. Sensitive actions remain human-controlled.</desc>
<defs>
<marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#475569" stroke-width="1.6"/></marker>
<marker id="green" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#15803d" stroke-width="1.6"/></marker>
<marker id="purple" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M1 1 L8 5 L1 9" fill="none" stroke="#7c3aed" stroke-width="1.6"/></marker>
</defs>
<rect x="1" y="1" width="1438" height="1058" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="2"/>
<g font-family="Arial, Helvetica, sans-serif">
<text x="160" y="65" font-size="30" font-weight="700" fill="#0f172a">SecureKeyBox | How the system works</text>
<text x="160" y="101" font-size="18" fill="#475569">From network activity to validated action and verifiable evidence</text>
<text x="160" y="171" font-size="14" font-weight="700" fill="#2563eb">NETWORK OBSERVATION AND ENFORCEMENT</text>
<text x="160" y="411" font-size="14" font-weight="700" fill="#0f766e">EVENT PROCESSING AND OPERATIONAL VISIBILITY</text>
<text x="580" y="651" font-size="14" font-weight="700" fill="#a16207">DECISIONS, EVIDENCE AND ASSISTANCE</text>
<g fill="none" stroke="#475569" stroke-width="2.5" marker-end="url(#arrow)">
<path d="M520 275 H580"/><path d="M940 275 H1000"/>
<path d="M1180 360 V430"/>
<path d="M1000 515 H940"/><path d="M580 515 H520"/>
<path d="M340 600 V670"/>
<path d="M520 755 H580"/><path d="M940 755 H1000"/>
</g>
<path d="M160 755 H85 V137 H760 V190" fill="none" stroke="#15803d" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#green)"/>
<rect x="297" y="122" width="360" height="28" fill="#ffffff"/>
<text x="477" y="142" text-anchor="middle" font-size="15" font-weight="700" fill="#15803d">Approved decisions update firewall rules</text>
<rect x="160" y="190" width="360" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="178" y="209" width="38" height="28" rx="4" fill="#2563eb"/>
<text x="197" y="229" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">01</text>
<text x="178" y="270" font-size="23" font-weight="700" fill="#0f172a">Traffic ingress</text>
<text x="178" y="305" font-size="17" fill="#334155">Upstream network interface</text>
<text x="178" y="332" font-size="17" fill="#334155">Incoming connections</text>
<rect x="580" y="190" width="360" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="598" y="209" width="38" height="28" rx="4" fill="#2563eb"/>
<text x="617" y="229" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">02</text>
<text x="598" y="270" font-size="23" font-weight="700" fill="#0f172a">Firewall policy</text>
<text x="598" y="305" font-size="17" fill="#334155">Allow or refuse traffic</text>
<text x="598" y="332" font-size="17" fill="#334155">Apply active network rules</text>
<rect x="1000" y="190" width="360" height="170" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
<rect x="1018" y="209" width="38" height="28" rx="4" fill="#2563eb"/>
<text x="1037" y="229" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">03</text>
<text x="1018" y="270" font-size="23" font-weight="700" fill="#0f172a">Detection and analysis</text>
<text x="1018" y="305" font-size="17" fill="#334155">Suricata alerts / Zeek flows</text>
<text x="1018" y="332" font-size="17" fill="#334155">Protocols, services, anomalies</text>
<rect x="1000" y="430" width="360" height="170" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<rect x="1018" y="449" width="38" height="28" rx="4" fill="#0f766e"/>
<text x="1037" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">04</text>
<text x="1018" y="510" font-size="23" font-weight="700" fill="#0f172a">Event normalization</text>
<text x="1018" y="545" font-size="17" fill="#334155">Backend creates common records</text>
<text x="1018" y="572" font-size="17" fill="#334155">Source, destination, time, severity</text>
<rect x="580" y="430" width="360" height="170" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<rect x="598" y="449" width="38" height="28" rx="4" fill="#0f766e"/>
<text x="617" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">05</text>
<text x="598" y="510" font-size="23" font-weight="700" fill="#0f172a">Risk correlation</text>
<text x="598" y="545" font-size="17" fill="#334155">Assets + vulnerabilities + alerts</text>
<text x="598" y="572" font-size="17" fill="#334155">Prioritize investigation</text>
<rect x="160" y="430" width="360" height="170" rx="8" fill="#f0fdfa" stroke="#0f766e" stroke-width="1.5"/>
<rect x="178" y="449" width="38" height="28" rx="4" fill="#0f766e"/>
<text x="197" y="469" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">06</text>
<text x="178" y="510" font-size="23" font-weight="700" fill="#0f172a">Operator dashboard</text>
<text x="178" y="545" font-size="17" fill="#334155">Equipment, incidents, health</text>
<text x="178" y="572" font-size="17" fill="#334155">Reports and audit indicators</text>
<rect x="160" y="670" width="360" height="170" rx="8" fill="#fefce8" stroke="#a16207" stroke-width="1.5"/>
<rect x="178" y="689" width="38" height="28" rx="4" fill="#a16207"/>
<text x="197" y="709" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">07</text>
<text x="178" y="750" font-size="23" font-weight="700" fill="#0f172a">Human validation</text>
<text x="178" y="785" font-size="17" fill="#334155">Approve sensitive changes</text>
<text x="178" y="812" font-size="17" fill="#334155">Blocks, exceptions, remediation</text>
<rect x="580" y="670" width="360" height="170" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
<rect x="598" y="689" width="38" height="28" rx="4" fill="#15803d"/>
<text x="617" y="709" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">08</text>
<text x="598" y="750" font-size="23" font-weight="700" fill="#0f172a">Signed evidence</text>
<text x="598" y="785" font-size="17" fill="#334155">Hash, chain, sign, verify</text>
<text x="598" y="812" font-size="17" fill="#334155">Preserve an auditable record</text>
<rect x="1000" y="670" width="360" height="170" rx="8" fill="#faf5ff" stroke="#7c3aed" stroke-width="1.5"/>
<rect x="1018" y="689" width="38" height="28" rx="4" fill="#7c3aed"/>
<text x="1037" y="709" text-anchor="middle" font-size="15" font-weight="700" fill="#ffffff">09</text>
<text x="1018" y="750" font-size="23" font-weight="700" fill="#0f172a">SOC assistant</text>
<text x="1018" y="785" font-size="17" fill="#334155">Retrieve documents, logs, reports</text>
<text x="1018" y="812" font-size="17" fill="#334155">Explain context and suggest checks</text>
<path d="M1180 840 V905 H340 V840" fill="none" stroke="#7c3aed" stroke-width="2.5" stroke-dasharray="8 6" marker-end="url(#purple)"/>
<rect x="440" y="889" width="635" height="32" fill="#ffffff"/>
<text x="757" y="911" text-anchor="middle" font-size="16" fill="#7c3aed">Assistant guidance supports the operator; final decisions remain human-controlled</text>
<line x1="160" y1="961" x2="1360" y2="961" stroke="#e2e8f0"/>
<text x="760" y="1008" text-anchor="middle" font-size="21" font-weight="700" fill="#0f172a">OBSERVE  &#8594;  CORRELATE  &#8594;  DECIDE  &#8594;  ENFORCE  &#8594;  PROVE</text>
</g></svg>
